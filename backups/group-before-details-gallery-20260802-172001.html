<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تفاصيل مجموعات مركز كفرأبيل القرآني">
  <title>تفاصيل المجموعة | مركز كفرأبيل القرآني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--green:#0f4d3f;--light:#e8f3ee;--gold:#c9a24b;--text:#1c2b26;--soft:#4d5f58;--white:#fff;--ivory:#faf7f0;--shadow:0 10px 34px rgba(15,77,63,.12)}
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;overflow-x:hidden}body{font-family:Cairo,sans-serif;background:var(--ivory);color:var(--text);line-height:1.8}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}.container{width:min(1120px,calc(100% - 32px));margin:auto}
    header{background:var(--green);color:#fff}.topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.back{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:9px 16px;border-radius:10px;font-weight:700}.back:hover{background:rgba(255,255,255,.2)}
    .hero{background:linear-gradient(145deg,var(--green),#1f7a5f);color:#fff;padding:72px 0}.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}.tag{display:inline-block;background:rgba(255,255,255,.14);color:#f1d690;padding:5px 14px;border-radius:20px;font-size:.85rem;font-weight:700}.hero h1{font-size:clamp(2rem,5vw,3.5rem);margin:14px 0}.hero p{color:rgba(255,255,255,.86);max-width:720px}.hero-image{aspect-ratio:4/3;border-radius:20px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.25);background:var(--light);display:grid;place-items:center;font-size:4rem}.hero-image img{width:100%;height:100%;object-fit:cover}
    main{padding:64px 0}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.fact{background:#fff;border:1px solid #e1e6e2;border-radius:16px;padding:24px;box-shadow:0 2px 10px rgba(15,77,63,.07);border-top:4px solid var(--gold)}.fact span{display:block;color:var(--soft);font-size:.82rem;margin-bottom:4px}.fact strong{display:block;color:var(--green);font-size:1.08rem}
    footer{background:var(--green);color:rgba(255,255,255,.75);text-align:center;padding:24px}
    @media(max-width:800px){.hero{padding:50px 0}.hero-grid{grid-template-columns:1fr}.hero-image{max-width:520px}}
    @media(max-width:480px){.container{width:min(100% - 24px,1120px)}.topbar{min-height:64px;font-size:.8rem}.back{padding:7px 10px}.facts{grid-template-columns:1fr}.fact{padding:19px}.hero h1{font-size:1.85rem}}
  </style>
</head>
<body>
  <header>
    <div class="container topbar">
      <strong>مركز كفرأبيل القرآني</strong>
      <a class="back" href="index.html#projects">← العودة إلى المجموعات</a>
    </div>
  </header>
  <section class="hero">
    <div class="container hero-grid">
      <div><span class="tag">مجموعة قرآنية</span><h1 id="groupName"></h1><p id="groupSummary"></p></div>
      <div class="hero-image" id="groupImage"></div>
    </div>
  </section>
  <main>
    <div class="container">
      <div class="facts" id="groupFacts" aria-label="معلومات المجموعة"></div>
    </div>
  </main>
  <footer>مركز كفرأبيل القرآني</footer>
  <script>
    /* قالب موحد: أضف أو عدّل معلومات أي مجموعة داخل هذا الكائن فقط. */
    const groups = {
      almanar: {
        name: 'مشروع المنار القرآني',
        summary: 'يضم المشروع 12 طالبًا، منهم 8 من حفاظ كتاب الله، بإشراف المعلم قصي بشارات.',
        image: 'assets/images/project-al-manar.jpeg',
        facts: [
          ['المعلم', 'قصي بشارات'],
          ['عدد الطلاب', '12 طالبًا'],
          ['حفاظ القرآن', '8 حفاظ']
        ]
      },
      almukhbiteen: {
        name: 'مشروع المخبتين القرآني',
        summary: 'نشأ المشروع عام 2023، ويضم 13 طالبًا من مواليد 2011–2015، وفيه حافظ واحد، ومتوسط الحفظ في المجموعة 15 جزءًا.',
        image: 'assets/images/project-al-mukhbiteen.jpeg',
        facts: [
          ['المعلم', 'محمد عادل'],
          ['سنة التأسيس', '2023'],
          ['عدد الطلاب', '13 طالبًا'],
          ['سنوات الميلاد', '2011–2015'],
          ['حفاظ القرآن', 'حافظ واحد'],
          ['متوسط الحفظ', '15 جزءًا']
        ]
      },
      faseeroo: {
        name: 'مشروع فسيروا القرآني',
        summary: 'يضم المشروع 12 طالبًا، بإشراف المعلم محمد رائد.',
        image: null,
        facts: [
          ['المعلم', 'محمد رائد'],
          ['عدد الطلاب', '12 طالبًا']
        ]
      },
      munibeen: {
        name: 'مشروع منيبين إليه',
        summary: 'يضم المشروع 13 طالبًا، بإشراف المعلم بهاء الفقيه.',
        image: null,
        facts: [
          ['المعلم', 'بهاء الفقيه'],
          ['عدد الطلاب', '13 طالبًا']
        ]
      },
      ahbaballah: {
        name: 'مشروع أحباب الله',
        summary: 'يضم المشروع 14 طالبًا، بإشراف المعلم بهاء الفقيه.',
        image: null,
        facts: [
          ['المعلم', 'بهاء الفقيه'],
          ['عدد الطلاب', '14 طالبًا']
        ]
      }
    };

    const key = new URLSearchParams(location.search).get('id');
    const data = groups[key] || groups.almanar;
    const byId = id => document.getElementById(id);

    document.title = `${data.name} | مركز كفرأبيل القرآني`;
    byId('groupName').textContent = data.name;
    byId('groupSummary').textContent = data.summary;
    byId('groupImage').innerHTML = data.image ? `<img src="${data.image}" alt="${data.name}">` : '📖';
    byId('groupFacts').innerHTML = data.facts.map(([label, value]) => `
      <div class="fact"><span>${label}</span><strong>${value}</strong></div>
    `).join('');
  </script>
</body>
</html>
